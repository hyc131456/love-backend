name: Build backend and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types:
      - frontend-image-published

permissions:
  contents: read
  packages: write

concurrency:
  group: love-app-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_backend:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - build_backend
    if: >-
      ${{ always() &&
          (needs.build_backend.result == 'success' ||
           needs.build_backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check deployment configuration
        id: deploy_config
        shell: bash
        run: |
          port="${DEPLOY_PORT:-22}"
          path="${DEPLOY_PATH:-/opt/love-app/love-backend}"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

          if [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && \
                -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped because SSH deployment secrets are not configured."
          fi

      - name: Configure SSH
        if: steps.deploy_config.outputs.enabled == 'true'
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy on server
        if: steps.deploy_config.outputs.enabled == 'true'
        shell: bash
        env:
          PORT: ${{ steps.deploy_config.outputs.port }}
          PATH_ON_SERVER: ${{ steps.deploy_config.outputs.path }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '$PATH_ON_SERVER'" <<'REMOTE'
          set -euo pipefail

          deploy_path="$1"
          cd "$deploy_path"
          git pull --ff-only origin master

          if [[ ! -f .env ]]; then
            echo "Missing $deploy_path/.env" >&2
            exit 1
          fi

          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE
